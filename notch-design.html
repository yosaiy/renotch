<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacBook Dynamic Notch Design — renotch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      --bg-desktop: #0b0f19;
      --notch-bg-black: #000000;
      --notch-bg-glass: rgba(18, 22, 32, 0.72);
      --notch-border-glass: rgba(255, 255, 255, 0.12);
      --notch-shadow-black: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --notch-shadow-glass: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      
      --accent-blue: #0A84FF;
      --accent-green: #30D158;
      --accent-orange: #FF9F0A;
      --accent-purple: #BF5AF2;
      --accent-pink: #FF375F;
      --accent-cyan: #64D2FF;
      --current-accent: var(--accent-green);

      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.4);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --surface-active: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.08);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --spring-transition: all 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      --fast-transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-desktop);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(48, 209, 88, 0.12), transparent 45%),
        radial-gradient(circle at 20% 40%, rgba(10, 132, 255, 0.1), transparent 35%),
        radial-gradient(circle at 80% 60%, rgba(191, 90, 242, 0.08), transparent 35%);
    }

    /* Wallpaper Simulation Header */
    .macbook-menu-bar {
      width: 100%;
      height: 32px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      z-index: 10;
    }

    .menu-left, .menu-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .menu-left .apple-logo {
      font-size: 14px;
      line-height: 1;
    }

    .menu-left span.bold {
      font-weight: 600;
    }

    .menu-right {
      gap: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    /* ==========================================================================
       NOTCH CONTAINER & WRAPPER
       ========================================================================== */
    .notch-positioner {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .notch-surface {
      background: var(--notch-bg-black);
      color: var(--text-primary);
      position: relative;
      transform-origin: top center;
      transition: var(--spring-transition);
      box-shadow: var(--notch-shadow-black);
      overflow: hidden;

      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .notch-surface.theme-glass {
      background: var(--notch-bg-glass);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      box-shadow: var(--notch-shadow-glass);
      border: 1px solid var(--notch-border-glass);
      border-top: none;
    }

    .camera-lens {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #08080c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .camera-lens::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #111927;
      box-shadow: inset 0 0 2px rgba(10, 132, 255, 0.8);
    }

    .green-indicator-dot {
      position: absolute;
      right: -8px;
      top: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #30D158;
      box-shadow: 0 0 6px #30D158;
    }

    /* COMPACT MODE */
    .notch-surface.mode-compact {
      width: 290px;
      height: 34px;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      border-top-left-radius: 0px;
      border-top-right-radius: 0px;
      cursor: pointer;
    }

    .notch-surface.mode-compact:hover {
      width: 310px;
      background: #050507;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .compact-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .compact-left, .compact-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .compact-title {
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
      font-size: 11.5px;
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* EXPANDED MODE */
    .notch-surface.mode-expanded {
      width: 660px;
      height: 290px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      border-top-left-radius: 0px;
      border-top-right-radius: 0px;
    }

    .expanded-content {
      width: 100%;
      height: 100%;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* EXPANDED HEADER & TABS */
    .notch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    .dashboard-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--surface-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--fast-transition);
    }

    .dashboard-btn:hover {
      background: var(--surface-active);
    }

    .tab-navigation {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--fast-transition);
      border: none;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.icon-only {
      width: 28px;
      padding: 0;
      border-radius: 50%;
    }

    .nav-tab:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .nav-tab.active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.16);
      font-weight: 600;
      border-radius: 14px;
      padding: 0 12px;
    }

    .header-right-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-circle-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-hover);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--fast-transition);
    }

    .icon-circle-btn:hover {
      background: var(--surface-active);
      color: var(--text-primary);
    }

    /* SECTION VIEWS */
    .tab-content-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .section-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.25s ease forwards;
    }

    .section-view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SHELF VIEW SPECIFIC STYLING */
    .shelf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 6px 2px;
    }

    .shelf-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .shelf-empty-box {
      flex: 1;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
    }

    .shelf-empty-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(48, 209, 88, 0.14);
      border: 1px solid rgba(48, 209, 88, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shelf-empty-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    .shelf-empty-desc {
      font-size: 12.5px;
      color: var(--text-tertiary);
    }

    /* DEMO CONTROLS PANEL AT BOTTOM */
    .controls-panel {
      margin-top: 360px;
      background: rgba(15, 20, 32, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
      justify-content: center;
      max-width: 820px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      z-index: 5;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      padding: 7px 13px;
      border-radius: 8px;
      background: var(--surface-hover);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--fast-transition);
    }

    .ctrl-btn:hover {
      background: var(--surface-active);
      color: var(--text-primary);
    }

    .ctrl-btn.active {
      background: var(--text-primary);
      color: #000000;
      font-weight: 600;
      border-color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- macOS Top Menu Bar Simulation -->
  <header class="macbook-menu-bar">
    <div class="menu-left">
      <span class="apple-logo"></span>
      <span class="bold">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Go</span>
      <span>Window</span>
      <span>Help</span>
    </div>
    <div class="menu-right">
      <span>🚀 renotch v2.0</span>
      <span>⚡️ 98%</span>
      <span>Wed Aug 13 &nbsp;06:04 AM</span>
    </div>
  </header>

  <!-- DYNAMIC NOTCH INTERFACE COMPONENT -->
  <div class="notch-positioner">
    <div id="notchSurface" class="notch-surface mode-expanded theme-black">
      
      <!-- Camera Lens Hole -->
      <div class="camera-lens">
        <div id="greenDot" class="green-indicator-dot" style="display: none;"></div>
      </div>

      <!-- EXPANDED STATE CONTENT -->
      <div id="expandedContent" class="expanded-content">
        
        <!-- Header & Section Tabs Navigation -->
        <div class="notch-header">
          <button id="dashBtn" class="dashboard-btn" onclick="switchTab('dash')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
            Dashboard
          </button>

          <nav class="tab-navigation">
            <button class="nav-tab icon-only" data-tab="music" onclick="switchTab('music')" title="Music">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <button class="nav-tab icon-only" data-tab="coding" onclick="switchTab('coding')" title="Coding">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
            <button class="nav-tab active" data-tab="shelf" onclick="switchTab('shelf')" title="File Shelf">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2v7h20z"/><path d="M5.45 5.11L2 12v0h20v0l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
              <span>File Shelf</span>
            </button>
            <button class="nav-tab icon-only" data-tab="timer" onclick="switchTab('timer')" title="Timer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
            <button class="nav-tab icon-only" data-tab="todo" onclick="switchTab('todo')" title="Todos">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <button class="nav-tab icon-only" data-tab="calendar" onclick="switchTab('calendar')" title="Calendar">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </nav>

          <div class="header-right-tools">
            <button class="icon-circle-btn" title="Collapse Notch" onclick="setNotchMode('compact')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
          </div>
        </div>

        <!-- Dynamic Section Views -->
        <div class="tab-content-container">
          
          <!-- 4. SHELF VIEW (ACTIVE MATCHING SCREENSHOT) -->
          <div id="view-shelf" class="section-view active">
            <div class="shelf-header">
              <div class="shelf-header-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2.5"><path d="M22 12h-6l-2 3h-4l-2-3H2v7h20z"/><path d="M5.45 5.11L2 12v0h20v0l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                <span style="font-weight: 700; color: #FFFFFF;">File Shelf</span>
                <span style="color: var(--text-tertiary); font-weight: 500;">0 / 12</span>
              </div>
              <button class="icon-circle-btn" style="width: 24px; height: 24px; background: transparent; border: none;" title="Clear Shelf">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
            
            <div class="shelf-empty-box">
              <div class="shelf-empty-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2v7h20z"/><path d="M5.45 5.11L2 12v0h20v0l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
              </div>
              <div class="shelf-empty-title">Shelf is empty</div>
              <div class="shelf-empty-desc">Drag files onto the notch to add them</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.tab !== tabId) {
          tab.classList.add('icon-only');
          const span = tab.querySelector('span');
          if (span) span.style.display = 'none';
        }
      });

      const activeTab = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
      if (activeTab) {
        activeTab.classList.add('active');
        activeTab.classList.remove('icon-only');
        let span = activeTab.querySelector('span');
        if (span) span.style.display = 'inline';
      }
    }
  </script>
</body>
</html>
